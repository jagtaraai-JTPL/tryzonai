events {}
http {
    server {
    listen 80;
    server_name tryzonai.com www.tryzonai.com;
    client_max_body_size 50M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_body_timeout 600s;

    # GZIP COMPRESSION
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. RESULT IMAGES (Direct Serving)
    location ^~ /outputs/ {
        alias /home/hemendramehra/tryzonai_server/output/;
        autoindex on;
        access_log on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        
        if ($request_filename ~* \.(jpg|jpeg|png|webp|png)$) {
             add_header Content-Disposition "inline";
        }
    }

    # 1B. INPUT IMAGES (Direct Serving for Person Original Photo)
    location ^~ /inputs/ {
        alias /home/hemendramehra/tryzonai_server/input/;
        autoindex on;
        access_log on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        
        if ($request_filename ~* \.(jpg|jpeg|png|webp)$) {
             add_header Content-Disposition "inline";
        }
    }

    # 1C. UPLOAD IMAGES (Direct Serving)
    location ^~ /uploads/ {
        alias /home/hemendramehra/tryzonai_server/input/;
        autoindex on;
        access_log on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        
        if ($request_filename ~* \.(jpg|jpeg|png|webp)$) {
             add_header Content-Disposition "inline";
        }
    }

    # 2. STATIC ASSETS CACHING (Next.js _next/static)
    location /_next/static/ {
        proxy_pass http://localhost:3000/_next/static/;
        proxy_http_version 1.1;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. PUBLIC ASSETS (Images, Fonts in /public)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|webp|map)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
    }

    # 4. BACKEND API
    location ^~ /api/v1/ {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    }

    # 5. ADMIN DASHBOARD
    location /admin {
        proxy_pass http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 6. FRONTEND (Next.js App)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        }
}
}


