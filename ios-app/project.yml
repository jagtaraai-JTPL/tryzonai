name: TryZonAI
options:
  bundleIdPrefix: com.jagtarapvtltd
  createSharedSchemes: true
  deploymentTarget:
    iOS: 16.0
targets:
  TryZonAI:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: TryZonAI/App
      - path: TryZonAI/Models
      - path: TryZonAI/Services
      - path: TryZonAI/Views
    settings:
      PRODUCT_NAME: TryZonAI
      SWIFT_VERSION: "5.0"
      SWIFT_COMPILATION_MODE: wholemodule
      ALWAYS_SEARCH_USER_PATHS: "NO"
      PRODUCT_BUNDLE_IDENTIFIER: com.jagtarapvtltd.tryzonai
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "TryZon AI requires camera access to capture your body photo for instant virtual outfit fitting."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "TryZon AI requires photo library access to select outfit garments and model pictures for try-on."
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: ${BUILD_NUMBER:1}
      DEVELOPMENT_TEAM: 4WRPJFD6RA
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGN_IDENTITY: "Apple Distribution"
      "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "TryZon AI App Store Profile"
      "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "TryZon AI App Store Profile"
      CODE_SIGN_ENTITLEMENTS: TryZonAI/TryZonAI.entitlements

