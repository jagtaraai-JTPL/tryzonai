name: TryZonAI
options:
  bundleIdPrefix: com.jagtarapvtltd
  createSharedSchemes: true
  deploymentTarget:
    iOS: 16.0
targets:
  TryZonAI:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: TryZonAI
        excludes:
          - "*.png"
          - "*.p8"
          - "Resources/Info.plist"
          - "*.entitlements"
    settings:
      PRODUCT_NAME: TryZonAI
      SWIFT_VERSION: "5.0"
      PRODUCT_BUNDLE_IDENTIFIER: com.jagtarapvtltd.tryzonai
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: TryZonAI/Resources/Info.plist
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: ${BUILD_NUMBER:1}
      DEVELOPMENT_TEAM: 4WRPJFD6RA
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGN_IDENTITY: "Apple Distribution"
      "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "TryZon AI App Store Profile"
      "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "TryZon AI App Store Profile"
      CODE_SIGN_ENTITLEMENTS: TryZonAI/TryZonAI.entitlements

