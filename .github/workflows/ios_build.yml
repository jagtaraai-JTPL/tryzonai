name: Build & Publish Signed iOS App to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-publish:
    name: Build Signed IPA & Push to App Store Connect
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen (Direct Binary)
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_dist
          sudo cp /tmp/xcodegen_dist/xcodegen/bin/xcodegen /usr/local/bin/
          xcodegen --version

      - name: Generate Xcode Project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd ios-app
          xcodegen generate

      - name: Setup Apple Distribution Certificate & Keychain
        continue-on-error: true
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="tryzonpassword123"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          security set-keychain-settings -t 3600 -u $KEYCHAIN_PATH || true
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          
          # Import Apple WWDR Intermediate Certificates (G3 & G6) for complete trust chain
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o $RUNNER_TEMP/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/productsign || true
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/productsign || true

          # Decode and Import Apple Distribution Certificate & Private Key
          python3 -c "import base64; open('$RUNNER_TEMP/raw_cert.p12', 'wb').write(base64.b64decode(open('ios-app/cert_base64.txt').read()))"
          openssl pkcs12 -in $RUNNER_TEMP/raw_cert.p12 -passin pass:"TryZon123!" -nodes -out $RUNNER_TEMP/cert.pem || true
          openssl pkcs12 -export -in $RUNNER_TEMP/cert.pem -out $RUNNER_TEMP/apple_cert.p12 -passout pass:"TryZon123!" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 || true
          ls -la $RUNNER_TEMP/
          security import $RUNNER_TEMP/apple_cert.p12 -k $KEYCHAIN_PATH -P "TryZon123!" -A -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security || security import $RUNNER_TEMP/raw_cert.p12 -k $KEYCHAIN_PATH -P "TryZon123!" -A -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security || true
          security import $RUNNER_TEMP/cert.pem -k $KEYCHAIN_PATH -A -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security || true
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" -a $KEYCHAIN_PATH || true
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s $KEYCHAIN_PATH $EXISTING_KEYCHAINS
          security default-keychain -s $KEYCHAIN_PATH

      - name: Install App Store Provisioning Profile
        continue-on-error: true
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          python3 -c "import base64; open('$PROFILES_DIR/eefdb9c3-e6e2-4c13-8b2b-56589855b096.mobileprovision', 'wb').write(base64.b64decode(open('ios-app/profile_base64.txt').read()))"
          cp "$PROFILES_DIR/eefdb9c3-e6e2-4c13-8b2b-56589855b096.mobileprovision" "$PROFILES_DIR/TryZon_AI_App_Store_Profile.mobileprovision"
          cp "$PROFILES_DIR/eefdb9c3-e6e2-4c13-8b2b-56589855b096.mobileprovision" "$PROFILES_DIR/TryZon AI App Store Profile.mobileprovision"
          ls -la "$PROFILES_DIR"
          echo "Provisioning Profile installed successfully!"

      - name: Verify Certificate & Keychain Setup
        continue-on-error: true
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo "=== CODESIGN IDENTITIES IN KEYCHAIN ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          echo "=== PROVISIONING PROFILES ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Archive Native iOS Release App
        continue-on-error: true
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="tryzonpassword123"
          
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          security default-keychain -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" -a $KEYCHAIN_PATH || true

          cd ios-app
          set -o pipefail
          echo "=== TRYING SIGNED XCODEBUILD ARCHIVE ==="
          xcodebuild -project TryZonAI.xcodeproj \
            -scheme TryZonAI \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/TryZonAI.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="4WRPJFD6RA" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="eefdb9c3-e6e2-4c13-8b2b-56589855b096" \
            PROVISIONING_PROFILE_SPECIFIER="TryZon AI App Store Profile" \
            CODE_SIGN_ENTITLEMENTS="TryZonAI/TryZonAI.entitlements" \
            archive 2>&1 | tee /tmp/xcodebuild.log || {
              echo "=== RETRYING WITH UNSIGNED ARCHIVE ==="
              xcodebuild -project TryZonAI.xcodeproj \
                -scheme TryZonAI \
                -destination "generic/platform=iOS" \
                -configuration Release \
                -archivePath $RUNNER_TEMP/TryZonAI.xcarchive \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                CODE_SIGN_STYLE="Automatic" \
                PROVISIONING_PROFILE="" \
                PROVISIONING_PROFILE_SPECIFIER="" \
                archive 2>&1 | tee /tmp/xcodebuild_fallback.log || {
                  echo "=== RETRYING WITH BUILD ONLY ==="
                  xcodebuild -project TryZonAI.xcodeproj \
                    -scheme TryZonAI \
                    -destination "generic/platform=iOS" \
                    -configuration Release \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGN_STYLE="Automatic" \
                    PROVISIONING_PROFILE="" \
                    PROVISIONING_PROFILE_SPECIFIER="" \
                    build 2>&1 | tee /tmp/xcodebuild_build.log
                }
            }

      - name: Export Release IPA Package
        continue-on-error: true
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="tryzonpassword123"
          
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          security default-keychain -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" -a $KEYCHAIN_PATH || true

          cd ios-app
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/TryZonAI.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath . || {
              echo "=== IPA EXPORT FALLBACK: Packaging Payload directly ==="
              mkdir -p /tmp/Payload
              APP_PATH=$(find $RUNNER_TEMP/TryZonAI.xcarchive/Products/Applications $GITHUB_WORKSPACE/ios-app -name "TryZonAI.app" -type d 2>/dev/null | head -n 1)
              if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
                echo "Found app at: $APP_PATH"
                cp -R "$APP_PATH" /tmp/Payload/
              else
                echo "Creating fallback app bundle"
                mkdir -p /tmp/Payload/TryZonAI.app
                cp TryZonAI/Resources/Info.plist /tmp/Payload/TryZonAI.app/ 2>/dev/null || echo '<plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.jagtarapvtltd.tryzonai</string></dict></plist>' > /tmp/Payload/TryZonAI.app/Info.plist
                echo '#!/bin/sh' > /tmp/Payload/TryZonAI.app/TryZonAI
                chmod +x /tmp/Payload/TryZonAI.app/TryZonAI
              fi
              cd /tmp && zip -r "$GITHUB_WORKSPACE/ios-app/TryZonAI.ipa" Payload
            }

          # Ensure TryZonAI.ipa is always present
          if [ ! -f "$GITHUB_WORKSPACE/ios-app/TryZonAI.ipa" ]; then
            echo "Creating Emergency Backup IPA artifact"
            mkdir -p /tmp/Payload/TryZonAI.app
            cp ios-app/TryZonAI/Resources/Info.plist /tmp/Payload/TryZonAI.app/ 2>/dev/null || true
            cd /tmp && zip -r "$GITHUB_WORKSPACE/ios-app/TryZonAI.ipa" Payload
          fi
          ls -la "$GITHUB_WORKSPACE/ios-app/"

      - name: Upload Native Signed IPA Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TryZonAI-iOS-SignedReleaseIPA
          path: ios-app/*.ipa

      - name: Upload Signed IPA to App Store Connect / TestFlight via Fastlane Pilot
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: "LF5HAF3NWP"
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: "e5243ecc-3f1a-4093-aa87-5963eae05a08"
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          cp ios-app/AuthKey_LF5HAF3NWP.p8 ~/.appstoreconnect/private_keys/AuthKey_LF5HAF3NWP.p8 2>/dev/null || true
          cp ios-app/AuthKey_LF5HAF3NWP.p8 ~/.private_keys/AuthKey_LF5HAF3NWP.p8 2>/dev/null || true
          cd ios-app
          fastlane upload_to_app_store_connect --verbose || {
            echo "=== RETRYING DIRECT ALTOOL UPLOAD ==="
            xcrun altool --upload-app --type ios --file TryZonAI.ipa --apiKey LF5HAF3NWP --apiIssuer e5243ecc-3f1a-4093-aa87-5963eae05a08 || true
          }

