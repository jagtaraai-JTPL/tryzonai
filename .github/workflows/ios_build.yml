name: Build & Publish Signed iOS App to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build Signed IPA & Push to App Store Connect
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen (Direct Binary)
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_dist
          sudo cp /tmp/xcodegen_dist/xcodegen/bin/xcodegen /usr/local/bin/
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate

      - name: Setup Apple Distribution Certificate & Keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="tryzonpassword123"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH || true
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          
          # Import Apple WWDR Intermediate Certificates (G3 & G6) for complete trust chain
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o $RUNNER_TEMP/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/productsign || true
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/productsign || true

          # Import Apple Distribution Certificate & Private Key
          cat ios-app/cert_base64.txt | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "TryZon123!" -A -T /usr/bin/codesign -T /usr/bin/productsign || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          security list-keychains -d user -s "$KEYCHAIN_PATH" /Library/Keychains/System.keychain
          security default-keychain -s $KEYCHAIN_PATH

      - name: Install App Store Provisioning Profile
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cat ios-app/profile_base64.txt | base64 --decode > "$PROFILES_DIR/eefdb9c3-e6e2-4c13-8b2b-56589855b096.mobileprovision"
          cat ios-app/profile_base64.txt | base64 --decode > "$PROFILES_DIR/TryZon_AI_App_Store_Profile.mobileprovision"
          echo "Provisioning Profile installed successfully with UUID eefdb9c3-e6e2-4c13-8b2b-56589855b096!"

      - name: Build & Upload to App Store Connect via Fastlane Gym & Pilot
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain
          KEYCHAIN_PASSWORD: "tryzonpassword123"
        run: |
          cd ios-app
          fastlane upload_to_app_store_connect

      - name: Output Fastlane Logs on Failure
        if: failure()
        run: |
          echo "=== FASTLANE GYM LOGS ==="
          cat ~/Library/Logs/gym/*.log 2>/dev/null || true

      - name: Upload Native IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryZonAI-iOS-SignedReleaseIPA
          path: ios-app/TryZonAI.ipa

