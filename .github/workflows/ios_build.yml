name: Build & Deploy iOS App to TestFlight

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload to App Store Connect
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Xcode Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Prepare TestFlight Release Suite
        run: |
          mkdir -p output_artifacts/TestFlight_Build
          cp -r ios-app/TryZonAI output_artifacts/TestFlight_Build/
          echo "App Store Connect Integration API Key: LF5HAF3NWP" > output_artifacts/TestFlight_Build/DEPLOY_LOG.txt

      - name: Upload TestFlight App Package
        uses: actions/upload-artifact@v4
        with:
          name: TryZonAI-iOS-TestFlightPackage
          path: output_artifacts/
