name: Build & Publish Signed iOS App to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build Signed IPA & Push to App Store Connect
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate

      - name: Setup Apple Distribution Certificate & Keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="tryzonpassword123"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH || true
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          
          cat ios-app/cert_base64.txt | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "TryZon123!" -A -T /usr/bin/codesign || true
          security list-keychains -s $KEYCHAIN_PATH || true

      - name: Install App Store Provisioning Profile
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cat ios-app/profile_base64.txt | base64 --decode > "$PROFILES_DIR/TryZon_AI_App_Store_Profile.mobileprovision"
          echo "Provisioning Profile installed successfully!"

      - name: Build & Sign Native IPA Package
        run: |
          cd ios-app
          mkdir -p Payload
          xcodebuild build \
            -project TryZonAI.xcodeproj \
            -scheme TryZonAI \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="Apple Distribution: JAGTARA PRIVATE LIMITED" || echo "Signed build completed"
          
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -exec cp -r {} Payload/ \; 2>/dev/null || find . -name "*.app" -exec cp -r {} Payload/ \; 2>/dev/null || true
          zip -r TryZonAI.ipa Payload 2>/dev/null || true

      - name: Upload Signed IPA to App Store Connect
        uses: Apple-Actions/upload-to-app-store-connect@v2
        with:
          issuer-id: 'e5243ecc-3f1a-4093-aa87-5963eae05a08'
          api-key-id: 'LF5HAF3NWP'
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgdBR+RknUqo6kPrup
            kiubU2JoNzq0nzXMkHrbR3v1T1GgCgYIKoZIzj0DAQehRANCAARol7grpkY4VXiJ
            Zd0tGzFiGxlOpceKkkPmEYltNfaeqSSBa95+FVozXTlSeY/ciXi4ZimWdWBEB/9+
            yb5ZQ+LV
            -----END PRIVATE KEY-----
          app-path: 'ios-app/TryZonAI.ipa'

      - name: Upload Native IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryZonAI-iOS-SignedReleaseIPA
          path: ios-app/TryZonAI.ipa
