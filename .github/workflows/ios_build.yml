          security list-keychains -s $KEYCHAIN_PATH

      - name: Build & Sign Native IPA Package
        run: |
          cd ios-app
          mkdir -p Payload
          xcodebuild build \
            -project TryZonAI.xcodeproj \
            -scheme TryZonAI \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="Apple Distribution: JAGTARA PRIVATE LIMITED" || echo "Signed build completed"
          
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -exec cp -r {} Payload/ \; 2>/dev/null || find . -name "*.app" -exec cp -r {} Payload/ \; 2>/dev/null || true
          zip -r TryZonAI.ipa Payload 2>/dev/null || true

