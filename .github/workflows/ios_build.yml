name: Build Native iOS IPA & Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Native IPA Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate

      - name: Set Xcode Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create Native Release IPA Package
        run: |
          cd ios-app
          mkdir -p Payload
          xcodebuild build \
            -project TryZonAI.xcodeproj \
            -scheme TryZonAI \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build
          
          find build -name "TryZonAI.app" -exec cp -r {} Payload/ \; 2>/dev/null || find build -name "*.app" -exec cp -r {} Payload/ \; 2>/dev/null || true
          zip -r TryZonAI.ipa Payload 2>/dev/null || true

      - name: Upload Native TryZonAI.ipa Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryZonAI-iOS-ReleaseIPA
          path: ios-app/TryZonAI.ipa
